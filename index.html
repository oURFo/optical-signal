<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <title>光訊號｜行動警示與摩斯碼</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=2">
  <script type="module" src="./app.js?v=2"></script>
</head>
<body>
  <main id="panel">
    <header>
      <p class="brand">光訊號 <span>／ 行動工具</span></p>
      <h1>警示燈與摩斯碼</h1>
      <p id="status" role="status">待命</p>
      <p id="wake-status" class="hint" hidden></p>
    </header>
    <aside>光敏性癲癇警語：本工具會產生閃光。請勿直視或朝人照射。</aside>
    <section aria-labelledby="quick">
      <h2 id="quick">快速啟動</h2>
      <div class="quick">
        <button id="red" class="red">紅快閃</button>
        <button id="amber" class="amber">紅黃快閃</button>
        <button id="sos">SOS 手電筒</button>
      </div>
    </section>
    <div class="grid">
      <section aria-labelledby="screen-title">
        <h2 id="screen-title">螢幕警示</h2>
        <p class="hint">可手動將手機亮度調至 100%。閃爍期間點擊畫面即可停止。</p>
        <label>顯示模式
          <select id="mode">
            <option value="1">全畫面 · 單色與黑色</option>
            <option value="2">全畫面 · 雙色循環</option>
            <option value="3">全畫面 · 三色循環</option>
            <option value="vertical">分割 · 上下對調</option>
            <option value="horizontal">分割 · 左右對調</option>
          </select>
        </label>
        <div id="colors" class="colors"></div>
        <label for="interval">畫面切換間隔 <output id="interval-value"></output></label>
        <input id="interval" type="range" min="200" max="2000" step="10" value="400">
        <button id="screen" class="primary">啟動螢幕警示</button>
      </section>
      <section aria-labelledby="torch-title">
        <h2 id="torch-title">LED 手電筒</h2>
        <p class="hint">啟動時會要求後置相機權限，需鏡頭支援閃光燈控制。</p>
        <label for="period">亮燈週期 <output id="period-value"></output></label>
        <input id="period" type="range" min="1" max="5" step=".5" value="2">
        <p class="hint">每次亮燈 300 ms。</p>
        <button id="torch" class="primary">啟動定時閃爍</button>
      </section>
      <section class="morse" aria-labelledby="morse-title">
        <h2 id="morse-title">摩斯碼發送</h2>
        <label>輸入英文字母、數字與空白
          <input id="message" type="text" placeholder="例如 HELLO 123" maxlength="160" autocomplete="off" spellcheck="false" autocapitalize="characters">
        </label>
        <div id="preview" aria-label="摩斯碼預覽">輸入後顯示摩斯碼</div>
        <label for="unit">每個時間單位 <output id="unit-value"></output></label>
        <input id="unit" type="range" min="150" max="500" step="10" value="200">
        <label class="check"><input id="loop" type="checkbox"> 無限循環發送</label>
        <button id="send" class="primary" disabled>用手電筒發送</button>
      </section>
      <section class="morse" aria-labelledby="receive-title">
        <h2 id="receive-title">接收光學摩斯碼</h2>
        <p class="hint">開啟後鏡頭，框住光源並鎖定。光源已在閃爍時可直接取樣校準，也可分別校準亮燈和熄燈。</p>
        <button id="receive-open" class="primary">開啟接收鏡頭</button>
        <p id="receive-status" class="hint" role="status">鏡頭未開啟</p>
        <div id="receive-controls" hidden>
          <div id="camera-view">
            <video id="camera-preview" autoplay muted playsinline></video>
            <div id="camera-roi" aria-hidden="true"></div>
          </div>
          <label for="roi-size">選取框大小</label>
          <input id="roi-size" type="range" min="4" max="70" value="20">
          <button id="roi-lock">鎖定範圍</button>
          <p class="hint">可在預覽上拖曳畫新框，或拖動框內移動位置。</p>
          <div class="receive-actions">
            <button id="flash-calibrate" disabled>取樣閃爍校準</button>
            <button id="dark-calibrate" disabled>校準熄燈</button>
            <button id="light-calibrate" disabled>校準亮燈</button>
          </div>
          <p id="receive-signal" class="hint"></p>
          <label for="receive-unit">發送端時間單位（ms）</label>
          <input id="receive-unit" type="number" min="150" max="2000" step="10" value="200">
          <button id="receive-run" class="primary" disabled>開始解析</button>
        </div>
        <p id="receive-symbols" class="hint"></p>
        <label for="receive-text">解碼結果</label>
        <textarea id="receive-text" rows="3" readonly></textarea>
        <button id="receive-clear">清除結果</button>
      </section>
    </div>
    <footer id="install">iPhone 可從 Safari 的分享選單選擇「加入主畫面」。</footer>
    <div class="stop-bar"><button id="stop" class="stop">■　全部停止</button></div>
  </main>
  <button id="stage" aria-label="停止螢幕警示" hidden>
    <span id="first"></span><span id="second"></span>
    <span class="stage-hint">點擊停止</span>
  </button>
</body>
</html>
